<title>CreVa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: glass rail left, content column right; maroon ground with rose glow; liquid-glass cards, pill controls, icon tiles. Dark first, rose-tinted light variant. */
:root{
  --bg:#0A0912; --fx1:rgba(146,96,255,.30); --fx2:rgba(86,48,180,.22);
  --glass:rgba(255,255,255,.045); --surface:rgba(255,255,255,.05); --surface2:rgba(160,120,255,.14); --line:rgba(190,170,255,.14);
  --fg:#F4F1FB; --muted:#A8A2BD; --accent:#B58CFF; --grad:linear-gradient(135deg,#D2AEFF,#9C6CF4); --accent-soft:rgba(160,120,255,.17);
  --high:#FF7A80; --high-soft:rgba(255,90,100,.16); --amber:#FFB75E; --amber-soft:rgba(255,183,94,.14); --ok:#62D69C; --ok-soft:rgba(98,214,156,.14);
  --rights:#E5D6FF; --side:linear-gradient(180deg,rgba(26,19,48,.72),rgba(10,9,18,.96)); --shadow:0 10px 34px rgba(0,0,0,.45); --hi:rgba(255,255,255,.06);
  --on-grad:#1A0F33; --glow:rgba(150,104,246,.34); --navact:rgba(150,110,255,.2); --navact-ink:#fff;
  --d1:#B58CFF; --d2:#D2B8FF; --d3:#EEE3FF; --d4:#7A52C9; --d5:#4A3382; --l1:#D2AEFF; --l2:#8F5CF0; --avbg:linear-gradient(135deg,#E3D0FF,#B58CFF);
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#FFFBEE; --fx1:rgba(250,205,70,.32); --fx2:rgba(255,238,170,.5);
  --glass:rgba(255,255,255,.78); --surface:rgba(255,255,255,.8); --surface2:rgba(246,196,50,.16); --line:rgba(150,110,10,.15);
  --fg:#141A33; --muted:#6B7088; --accent:#A97300; --grad:linear-gradient(135deg,#FCDD70,#F0BA22); --on-grad:#1A1530; --accent-soft:rgba(244,190,40,.2); --glow:rgba(240,186,34,.38);
  --high:#C42C3C; --high-soft:rgba(196,44,60,.1); --amber:#9A6100; --amber-soft:rgba(246,196,50,.22); --ok:#1D7A4D; --ok-soft:rgba(29,122,77,.12);
  --rights:#1C2244; --side:linear-gradient(180deg,rgba(255,252,238,.94),rgba(255,247,215,.9)); --shadow:0 8px 28px rgba(150,110,10,.10); --hi:rgba(255,255,255,.95);
  --navact:#FFEEA6; --navact-ink:#141A33; --d1:#F0BA22; --d2:#F6D36A; --d3:#FBE9AE; --d4:#8A6A12; --d5:#3B3A55; --l1:#FCDD70; --l2:#E8A91A; --avbg:linear-gradient(135deg,#FCE08A,#F2BE2B); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#FFFBEE; --fx1:rgba(250,205,70,.32); --fx2:rgba(255,238,170,.5);
  --glass:rgba(255,255,255,.78); --surface:rgba(255,255,255,.8); --surface2:rgba(246,196,50,.16); --line:rgba(150,110,10,.15);
  --fg:#141A33; --muted:#6B7088; --accent:#A97300; --grad:linear-gradient(135deg,#FCDD70,#F0BA22); --on-grad:#1A1530; --accent-soft:rgba(244,190,40,.2); --glow:rgba(240,186,34,.38);
  --high:#C42C3C; --high-soft:rgba(196,44,60,.1); --amber:#9A6100; --amber-soft:rgba(246,196,50,.22); --ok:#1D7A4D; --ok-soft:rgba(29,122,77,.12);
  --rights:#1C2244; --side:linear-gradient(180deg,rgba(255,252,238,.94),rgba(255,247,215,.9)); --shadow:0 8px 28px rgba(150,110,10,.10); --hi:rgba(255,255,255,.95);
  --navact:#FFEEA6; --navact-ink:#141A33; --d1:#F0BA22; --d2:#F6D36A; --d3:#FBE9AE; --d4:#8A6A12; --d5:#3B3A55; --l1:#FCDD70; --l2:#E8A91A; --avbg:linear-gradient(135deg,#FCE08A,#F2BE2B); color-scheme:light}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(1100px 520px at 72% -8%,var(--fx1),transparent 62%),radial-gradient(900px 600px at -5% 105%,var(--fx2),transparent 60%);background-attachment:fixed;color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.ic{flex:none;display:block}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;border-right:1px solid var(--line);background:var(--side);backdrop-filter:blur(22px);display:flex;flex-direction:column;padding:22px 14px;gap:6px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
.brand b{display:block;font-size:27px;font-weight:700;letter-spacing:-.03em;line-height:1}
.brand span{display:block;font:500 10px var(--mono);color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-top:5px}
.nav{display:flex;align-items:center;gap:13px;width:100%;padding:12px 14px;border:0;background:none;border-radius:14px;text-align:left;cursor:pointer;color:var(--muted);font-weight:500;font-size:14.5px}
.nav:hover{background:var(--surface);color:var(--fg)}
.nav[aria-current="page"]{background:var(--navact);color:var(--navact-ink);font-weight:600;box-shadow:0 8px 22px var(--glow),inset 0 1px 0 rgba(255,255,255,.3)}
.nav .go{margin-left:auto}
:root:not([data-theme="light"]) .nav[aria-current="page"]{border:1px solid rgba(190,160,255,.35)}
.side .sp{flex:1}
.promo{display:grid;gap:6px;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--glass);cursor:pointer;color:var(--fg);box-shadow:inset 0 1px 0 var(--hi)}
.promo b{display:flex;align-items:center;gap:10px;color:var(--accent);font-weight:600}
.promo b .go{margin-left:auto}
.promo small{color:var(--muted);font-size:12px;line-height:1.5}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px clamp(16px,4vw,40px);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;backdrop-filter:blur(14px)}
.topbar .l{display:flex;align-items:center;gap:10px}
.topbar .rr{display:flex;align-items:center;gap:10px}
.btn.burger{display:none}
.pillbtn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--glass);cursor:pointer;font:500 11.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;box-shadow:inset 0 1px 0 var(--hi)}
.round{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 1px 0 var(--hi)}
.round i{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:#FF4D6A}
.who{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-weight:500}
.av{width:32px;height:32px;border-radius:50%;background:var(--avbg);overflow:hidden;flex:none}.av img{width:100%;height:100%;object-fit:cover;display:block}
.main{padding:14px clamp(16px,4vw,40px) 72px;max-width:1240px}
.scrim{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:40;transform:translateX(-102%);transition:transform .2s;padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
  .btn.burger{display:inline-flex}
  .who span{display:none}.who{padding:5px}
  .pillbtn{padding:9px 12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.eyebrow{font:500 11.5px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:22px}
.ph h1{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1;text-wrap:balance;margin-top:4px}
.ph h1 em{font-style:normal;color:var(--fg)}
.ph p{color:var(--muted);margin-top:6px;max-width:64ch;font-size:15px}
h2{font:500 11.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.h3{font-size:17px;font-weight:600;letter-spacing:-.01em;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.h3 a{font-size:13px;font-weight:500;color:var(--accent);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.sec{margin-top:26px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(16px) saturate(140%);box-shadow:var(--shadow),inset 0 1px 0 var(--hi)}
.pad{padding:20px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:-.02em}
.big{font-size:32px;font-weight:700;line-height:1.1}
.mid{font-size:24px;font-weight:700;line-height:1.15}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.g3,.g2,.g4{grid-template-columns:minmax(0,1fr)}}
.ib{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent);border:1px solid var(--line)}
.ib.sq{border-radius:14px;width:42px;height:42px}
.cells{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;background:none;border:0;box-shadow:none;backdrop-filter:none}
.cells>div{padding:18px;min-width:0;display:flex;gap:14px;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(16px);box-shadow:var(--shadow),inset 0 1px 0 var(--hi)}
.cells>div>div{min-width:0}
.cells.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.cells.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.cells,.cells.c4{grid-template-columns:minmax(0,1fr)}}
.lab{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.delta{font:500 12.5px var(--sans);color:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font:600 13px var(--sans);text-align:center;box-shadow:inset 0 1px 0 var(--hi)}
.btn:hover{border-color:var(--accent)}
.btn.p{background:var(--grad);border-color:transparent;color:var(--on-grad);box-shadow:0 8px 24px var(--glow),inset 0 1px 0 rgba(255,255,255,.32)}
.btn.p:hover{filter:brightness(1.08)}
.btn.sm{padding:8px 14px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sev{display:inline-block;padding:3px 10px;border-radius:8px;font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;background:var(--surface2);color:var(--muted)}
.sev.high{background:var(--high-soft);color:var(--high)}.sev.med{background:var(--amber-soft);color:var(--amber)}.sev.low{background:var(--surface2);color:var(--muted)}.sev.ok{background:var(--ok-soft);color:var(--ok)}.sev.acc{background:var(--accent-soft);color:var(--accent)}
.sev.solid{background:var(--grad);color:var(--on-grad)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
.dot.high{background:var(--high)}.dot.amber{background:var(--amber)}.dot.ok{background:var(--ok)}
.logo{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;font-size:19px;color:#fff;overflow:hidden}
.logo.lg{width:62px;height:62px;font-size:24px}
.logo.tx{font-size:10px;letter-spacing:-.02em}
.stat .lab{margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:16px;background:var(--glass);min-width:0;max-width:100%;box-shadow:inset 0 1px 0 var(--hi)}
.chip .ib{width:36px;height:36px}
.chip small{display:block;font:500 11px var(--sans);color:var(--muted)}
.chip b{font-weight:600;overflow-wrap:anywhere;font-size:13px;display:block}
.chip.high{border-color:var(--high)}.chip.med{border-color:var(--amber)}
.pillb{padding:9px 20px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px}
.pillb[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:var(--on-grad);box-shadow:0 6px 18px var(--glow)}
textarea,input[type=text],input[type=number],input[type=email],input[type=tel],input[type=date],input[type=url],select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);resize:vertical;line-height:1.55}
select option{background:var(--bg);color:var(--fg)}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
label.f{display:block;font-weight:600;margin-bottom:6px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:700px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.tabs{display:flex;gap:10px;margin-bottom:20px;overflow-x:auto;padding:2px}
.tab{padding:11px 26px;border-radius:999px;border:1px solid var(--line);background:var(--glass);cursor:pointer;font-weight:600;color:var(--fg);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--grad);border-color:transparent;color:var(--on-grad);box-shadow:0 8px 22px var(--glow)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0 8px}
th{text-align:left;font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);padding:6px 16px;white-space:nowrap}
td{padding:14px 16px;background:var(--surface);vertical-align:middle;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
td:first-child{border-left:1px solid var(--line);border-radius:16px 0 0 16px}
td:last-child{border-right:1px solid var(--line);border-radius:0 16px 16px 0}
td .tc{display:flex;align-items:center;gap:14px}
.note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:13.5px}
.note.warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.note.acc{background:var(--accent-soft);color:var(--fg);border-color:var(--line)}
.note.acc b{color:var(--accent)}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:10px}
.status .dot{width:7px;height:7px}
.skel{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--surface),var(--surface2),var(--surface));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.issue{padding:20px;border-bottom:1px solid var(--line);display:grid;gap:10px;min-width:0}
.issue:last-child{border-bottom:0}
.issue .hd{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.issue h3{font-size:17px;font-weight:600}
.quote{font:13px var(--mono);padding:10px 14px;background:var(--surface);border-radius:12px;overflow-wrap:anywhere;border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 14px}
.kv dt{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.kv dd{margin:0}
@media (max-width:600px){.kv{grid-template-columns:minmax(0,1fr)}}
.rrow{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.rrow:last-child{border-bottom:0}.rrow:hover{background:var(--surface)}
.rrow .t{flex:1;min-width:0}.rrow .t b{display:block;font-weight:600}.rrow .t span{color:var(--muted);font-size:13px}
.wf{position:relative;--lw:170px;--vw:90px;padding:6px 0}
.wf .r{display:grid;grid-template-columns:var(--lw) minmax(0,1fr) var(--vw);align-items:center;gap:10px;padding:5px 0}
.wf .r .n{font-size:13px;line-height:1.3;min-width:0}
.wf .r .v{text-align:right;font:500 13px var(--mono)}
.wf .trk{position:relative;height:22px;background:linear-gradient(var(--line),var(--line)) 0 100%/100% 1px no-repeat}
.wf .bar{position:absolute;top:2px;height:18px;border-radius:6px}
.bar.content{background:var(--grad)}.bar.rights{background:var(--rights)}.bar.finance{background:var(--muted);opacity:.7}.bar.total{background:var(--fg)}.bar.range{background:transparent;border:2px solid var(--accent)}
.wf .ref{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--high);left:calc(var(--lw) + 10px + (100% - var(--lw) - var(--vw) - 20px) * var(--p))}
.wf .refl{position:absolute;top:-16px;font:600 10.5px var(--mono);color:var(--high);white-space:nowrap;transform:translateX(-50%);left:calc(var(--lw) + 10px + (100% - var(--lw) - var(--vw) - 20px) * var(--p))}
@media (max-width:600px){.wf{--lw:104px;--vw:68px}.wf .r .n{font-size:12px}}
.split{display:flex;height:14px;border-radius:999px;overflow:hidden;margin:10px 0}
.split i{display:block}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.share{border:1px solid var(--line);border-radius:24px;background:var(--glass);backdrop-filter:blur(16px);padding:24px;max-width:540px;box-shadow:var(--shadow),inset 0 1px 0 var(--hi)}
.share .rng{font-size:38px;font-weight:700;line-height:1.1}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.modes{grid-template-columns:minmax(0,1fr)}}
.mode{text-align:left;padding:18px;border:1px solid var(--line);border-radius:20px;background:var(--glass);cursor:pointer;display:grid;gap:4px;box-shadow:inset 0 1px 0 var(--hi)}
.mode[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 10px 28px var(--glow);background:var(--accent-soft)}
.mode b{font:600 11.5px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.mode .pr{font-size:26px;font-weight:700}
.mode span.d{color:var(--muted);font-size:13px}
.ladder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;background:none;border:0;box-shadow:none;backdrop-filter:none}
.ladder>div{padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);min-width:0}
.ladder>div:last-child{background:var(--accent-soft);border-color:var(--accent)}
@media (max-width:600px){.ladder{grid-template-columns:minmax(0,1fr)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
details summary{cursor:pointer;color:var(--muted);font-weight:500}
.sevbar{display:flex;gap:5px}.sevbar i{width:26px;height:6px;border-radius:999px;background:var(--surface2)}.sevbar i.on{background:var(--grad)}
.small{font-size:12.5px}
.stack{display:grid;gap:16px}
.hide{display:none}
/* home */
.home2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
.col{display:grid;gap:18px;min-width:0}
@media (max-width:1050px){.home2{grid-template-columns:minmax(0,1fr)}}
.orow{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;flex-wrap:wrap;margin-bottom:10px}

const SPELL = {1:'one',2:'two',3:'three',4:'four',5:'five',6:'six',7:'seven',8:'eight',9:'nine',10:'ten'};
const sp = n => SPELL[n]||String(n);
const rk = {High:3,Medium:2,Low:1};
const SEVR = {HIGH:3,MEDIUM:2,LOW:1};

function parseAmount(msg){
  const re=/(?:₹|rs\.?|inr)\s*([\d,]+(?:\.\d+)?)\s*(k|l|lakh)?/gi; let m;
  while((m=re.exec(msg))){ let v=parseFloat(m[1].replace(/,/g,'')); const u=(m[2]||'').toLowerCase(); if(u==='k')v*=1000; else if(u==='l'||u==='lakh')v*=100000; if(v>=1000)return v; }
  const k=msg.match(/\b(\d+(?:\.\d+)?)\s*k\b/i); if(k)return parseFloat(k[1])*1000;
  // last resort: a comma-grouped number such as "25,000" (not a follower or view count)
  const b=msg.match(/\b(\d{1,3}(?:,\d{3})+)\b(?!\s*(?:followers|views|likes|subscribers|people))/i); if(b)return parseFloat(b[1].replace(/,/g,''));
  return null;
}
function dayVal(n,unit){ unit=unit.toLowerCase(); return unit.startsWith('month')?n*30:unit.startsWith('week')?n*7:n; }

function parseTerms(raw){
  const t = String(raw||'').toLowerCase().replace(/[()]/g,' ').replace(/\s+/g,' ');
  const T = {}; let r;
  const cnt=(re,fallbackRe)=>{ const m=t.match(new RegExp('\\b'+NW+'\\s*'+re)); if(m)return toN(m[1]); return fallbackRe&&fallbackRe.test(t)?1:0; };
  T.reels=cnt('(?:instagram\\s*|ig\\s*)?reels?\\b',/\breel\b/);
  T.stories=cnt('(?:instagram\\s*|ig\\s*)?stor(?:y|ies)\\b',/\bstor(?:y|ies)\\b/);
  T.li=cnt('linkedin\\s*posts?\\b',/linkedin\\s*post/);
  T.nl=cnt('newsletter',/newsletter/);
  T.barter=/barter|product only|gifted|in exchange for (?:the |our )?product|no cash|free product/.test(t);
  const pv=t.match(/valued at (?:₹|rs\.?|inr)\s*([\d,]+)/); T.productValue=pv?parseFloat(pv[1].replace(/,/g,'')):null;
  T.perp=/perpetu|forever|irrevocab|unlimited (?:use|usage|duration)|without (?:time )?limit/.test(t);
  T.paid=/paid (?:ads?|media|promotion|advertis\w*|amplification|campaigns?)|whitelist|spark ads?|boost(?:ed|ing)?|partnership ads?/.test(t);
  T.paidDur=/paid[^.;]{0,80}?\b(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten|twelve)\s*(?:days?|months?|weeks?)/.test(t);
  let u=t.match(new RegExp('\\b'+NW+'[- ](days?|months?|weeks?)(?:\\s*of)?\\s*(?:organic\\s*)?(?:re-?post\\w*\\s*)?(?:usage|licen[cs]e)'))
     ||t.match(new RegExp('usage[^.;]{0,50}?\\b'+NW+'[- ]?(days?|months?|weeks?)'));
  T.usageDays=u?dayVal(toN(u[1]),u[2]):null;
  let e=t.match(new RegExp('\\b'+NW+'[- ](months?|days?|weeks?)(?:\\s*of)?\\s*(?:category\\s*)?exclusiv'))
     ||t.match(new RegExp('exclusiv\\w*[^.;]{0,90}?\\b'+NW+'[- ](months?|days?|weeks?)'));
  T.exclNone=/\bno exclusiv|non-exclusiv|exclusivity: none/.test(t);
  T.exclMentioned=/exclusiv/.test(t);
  T.exclMonths=(e&&!T.exclNone)?dayVal(toN(e[1]),e[2])/30:(T.exclMentioned&&!T.exclNone?-1:0);
  let rv=t.match(new RegExp('\\b'+NW+'\\s*(?:rounds?\\s*of\\s*)?revision'))||t.match(/revisions?[^.;]{0,40}?(\d+)/);
  T.revisions=rv?toN(rv[1]):null;
  T.raw=/raw (?:footage|files|assets|clips)|unedited (?:footage|files)/.test(t);
  let p=t.match(/net[- ]?(\d+)/)||t.match(/(?:payment|paid|pay)[^.;]{0,60}?(\d+)\s*days/);
  T.payDays=p?+p[1]:null;
  T.ipAssign=/assign(?:s|ed)? (?:all )?(?:rights|copyright|ownership)|work made for hire|owns? all (?:rights|content)/.test(t);
  T.skincare=/skincare|serum|skin care|cosmetic/.test(t);
  T.indemnity=/indemnif|indemnity|hold harmless/.test(t);
  T.liability=/liabilit(?:y|ies)|uncapped|unlimited damages|consequential damages/.test(t);
  T.tax=/\b(?:tds|gst|withholding tax|income tax|taxes|tax)\b/.test(t);
  return T;
}

function clauseOf(con, re){
  if(!con) return null;
  const lines=con.split(/\n/);
  for(const ln of lines){ if(re.test(ln)){ const m=ln.match(/^\s*(\d+(?:\.\d+)*)[.)]?\s/); return {ref:m?m[1]:null,line:ln.replace(/^\s*\d+(?:\.\d+)*[.)]?\s*/,'').trim()}; } }
  return null;
}
function quoteFrom(c, re){ if(!c) return ''; const m=c.line.match(re); const q=m?m[0]:c.line; return q.length>130?q.slice(0,127)+'...':q; }

function parsePersona(msg){
  const f=msg.match(/([\d.,]+)\s*(k|m)?\s*followers/i); let followers=null;
  if(f){ followers=parseFloat(f[1].replace(/,/g,'')); const u=(f[2]||'').toLowerCase(); if(u==='k')followers*=1000; if(u==='m')followers*=1e6; }
  const en=msg.match(/([\d.]+)\s*%\s*(?:engagement|eng)/i);
  const never=/never (?:done|had|worked|taken)|first (?:ever )?(?:brand )?(?:deal|collab)|no (?:past |previous |prior )?brand deals?/i.test(msg);
  return {followers,engagement:en?parseFloat(en[1]):null,never,isOther:!!(f||never)};
}

function analyze(msg, con){
  const text = msg + '\n' + (con||'');
  const T = parseTerms(text);
  const P = parsePersona(msg);
  let ask = parseAmount(msg);
  const A = {msg, con:con||'', T, P, lines:[], unpriced:[], risks:[], unknown:[], noted:[], pending:false};
  A.ask = T.barter ? 0 : ask;
  A.productValue = T.productValue;
  const REEL=38000, LI=22000, NL=18000;
  const base = T.reels*REEL + T.li*LI + T.nl*NL;
  const parts=[]; if(T.reels)parts.push(T.reels+(T.reels>1?' Reels':' Reel')); if(T.li)parts.push(T.li+' LinkedIn '+(T.li>1?'posts':'post')); if(T.nl)parts.push(T.nl+' newsletter '+(T.nl>1?'mentions':'mention'));
  const delivParts=parts.slice(); if(T.stories)delivParts.push(T.stories+(T.stories>1?' Stories':' Story'));
  A.delivText = delivParts.join(' + ') || 'Not detected';
  const w=(n,s,p)=>(SPELL[n]||n)+' '+(n>1?p:s);
  const wp=[]; if(T.reels)wp.push(w(T.reels,'Reel','Reels')); if(T.stories)wp.push(w(T.stories,'Story','Stories')); if(T.li)wp.push(w(T.li,'LinkedIn post','LinkedIn posts')); if(T.nl)wp.push(w(T.nl,'newsletter mention','newsletter mentions'));
  A.delivWords = wp.length>1 ? wp.slice(0,-1).join(', ')+' and '+wp[wp.length-1] : (wp[0]||'the deliverables');
  const hasDeliv = base>0 || T.stories>0;
  if(base>0) A.lines.push({label:'Base content package',sub:parts.join(' + '),amount:base,group:'content'});
  if(T.stories>0) A.lines.push({label:'Plus '+T.stories+(T.stories>1?' Stories':' Story'),amount:T.stories*3000,group:'content'});
  if(T.paid) A.lines.push({label:'Plus paid media usage',amount:10000,group:'rights'});
  if(!T.perp && T.usageDays!=null && T.usageDays>=90) A.lines.push({label:'Plus usage of '+Math.round(T.usageDays/30)+' months',amount:6000,group:'rights'});
  if(T.exclMonths>0){ const mo=Math.round(T.exclMonths*10)/10; A.lines.push({label:'Plus '+mo+'-month exclusivity',amount:Math.round(mo*2000),group:'rights'}); }
  if(T.revisions>1) A.lines.push({label:'Plus revision exposure',sub:T.revisions+' rounds',amount:(T.revisions-1)*1500,group:'rights'});
  if(T.payDays>=90) A.lines.push({label:'Minus net-'+T.payDays+' payment',amount:-2000,group:'finance'});
  else if(T.payDays>=60) A.lines.push({label:'Minus net-'+T.payDays+' payment',amount:-1000,group:'finance'});
  if(T.perp) A.unpriced.push({label:'Perpetual usage',amount:15000});
  if(T.raw) A.unpriced.push({label:'Raw footage handover',amount:4000});
  A.lockout=null;
  if(!hasDeliv && T.exclMonths>0){ const mo=Math.round(T.exclMonths*10)/10; A.lockout={months:mo,amount:Math.round(mo*2000),category:T.skincare?'skincare':'competing-category'}; }
  A.indicative = A.lines.reduce((s,l)=>s+l.amount,0);
  A.content = A.lines.filter(l=>l.group==='content').reduce((s,l)=>s+l.amount,0);
  A.rights = A.lines.filter(l=>l.group==='rights').reduce((s,l)=>s+l.amount,0);
  A.finance = A.lines.filter(l=>l.group==='finance').reduce((s,l)=>s+l.amount,0);

  // evidence + confidence
  const TIER1_N=3, TIER2_N=12, MIN_N=5; // guardrail: fewer than 5 deals behind a number can never carry more than Low
  const rightsHeavy = T.paid||T.perp||T.exclMonths!==0&&!T.exclNone||T.ipAssign;
  const plainReel = T.reels>0 && !rightsHeavy && !T.barter;
  if(P.isOther){
    A.confidence='Low'; A.evidence={tier:3,count:0,text:'Tier 3 · 0 deals. No closed deals or network comparables were given for this creator.'};
  } else if(plainReel && TIER1_N>=MIN_N){
    A.confidence='High'; A.evidence={tier:1,count:TIER1_N,text:'Tier 1 · '+TIER1_N+' of your closed deals, with Tier 2 as cross-check'};
  } else if(TIER2_N>=MIN_N){
    A.confidence='Medium';
    A.evidence={tier:2,count:TIER2_N,text:plainReel
      ? 'Tier 2 · 12 network deals (median ₹54K). Your own 3 closed deals (₹42K, ₹51K, ₹57K) are under 5, so they cross-check the content base but cannot raise confidence.'
      : 'Tier 2 · 12 network deals (median ₹54K). Your own 3 deals inform the content base only.'};
  } else {
    A.confidence='Low'; A.evidence={tier:3,count:0,text:'Tier 3 · fewer than 5 comparable deals, so confidence stays Low.'};
  }
  const rnd=n=>Math.round(n/1000)*1000;
  if(!hasDeliv){
    A.rangeUnavailable='CreVa could not find deliverables in the text, so it cannot build a range for the content yet.';
  } else if(A.confidence==='Low'){
    A.low=rnd(A.indicative*0.7); A.high=rnd(A.indicative*1.15);
  } else {
    const spread=A.confidence==='High'?5000:8000; A.low=Math.max(0,A.indicative-spread); A.high=A.indicative;
  }
  if(T.barter){ A.low=A.high=undefined; }

  // risks
  const C = con||'';
  const add=(r)=>A.risks.push(r);
  if(T.perp){ const c=clauseOf(C,/perpetu|irrevocab|forever/i);
    add({key:'perpetual',sev:'HIGH',title:'Perpetual, worldwide usage',clause:c&&c.ref?'clause '+c.ref:(C?'clause not located':'in your message'),quote:quoteFrom(c,/worldwide[^.]*?perpetuity|irrevocab[^.;,]*|in perpetuity|forever/i)||'forever',
      line:'The brand keeps an advertising licence with no end date for a one-time fee.',
      reading:T.paid?'The brand can use this content anywhere in the world, in any medium including paid ads, with no end date and no way for you to withdraw it.':'The brand can use this content anywhere in the world with no end date and no way for you to withdraw it.',
      consequence:'You priced a campaign; the licence has no end date. The brand can keep using this content forever, including in paid ads, after the relationship ends.',
      suggestion:'Ask for a fixed window (for example 30 to 90 days organic) or a separate licensing fee.'}); }
  if(T.exclMonths!==0 && !T.exclNone){ const c=clauseOf(C,/exclusiv|will not promote/i); const m=T.exclMonths;
    const cat=T.skincare?'skincare':'competing-category';
    if(m===-1) add({key:'exclusivity',sev:'MEDIUM',title:'Exclusivity with no stated length',clause:c&&c.ref?'clause '+c.ref:'in your message',quote:quoteFrom(c,/exclusiv[^.]*/i)||'exclusivity',line:'Open-ended exclusivity can block other offers indefinitely.',reading:'Exclusivity is mentioned but no length is given.',consequence:'You cannot tell how long competing offers are off the table, and no premium is stated.',suggestion:'Ask for a fixed length and a fee for it, per month.'});
    else add({key:'exclusivity',sev:m>=3?'HIGH':'MEDIUM',title:(m>=1?Math.round(m*10)/10+'-month':'Short')+' category exclusivity',clause:c&&c.ref?'clause '+c.ref:'in your message',quote:quoteFrom(c,/will not promote[^.]*|exclusiv[^.]*/i)||'category exclusivity',
      line:`Blocks ${cat} offers for ${Math.round(m*10)/10} month${m>1?'s':''} with no stated premium.`,
      reading:`You cannot work with other ${cat} brands for ${Math.round(m*10)/10} months from posting.`,
      consequence:`Every other ${cat} offer for ${Math.round(m*10)/10} months is unavailable, at no stated premium. At 2 to 4 offers a month that is real foregone income.`,
      suggestion:'Shorten it to 30 days, or price it at about ₹2,000 per month as CreVa\'s reference model does.'}); }
  if(T.payDays>=60){ const c=clauseOf(C,/payment|net-?\d+/i);
    add({key:'payment',sev:T.payDays>=90?'MEDIUM':'LOW',title:'Net-'+T.payDays+' payment',clause:c&&c.ref?'clause '+c.ref:'in your message',quote:quoteFrom(c,/payment[^.]*/i)||'net-'+T.payDays,
      line:'You fund production and wait '+(T.payDays>=90?'a quarter':'two months')+' to be paid.',
      reading:'Payment arrives '+T.payDays+' days after delivery.',
      consequence:'You fund production and wait '+(T.payDays>=90?'a quarter':'about two months')+' to be paid. The brand effectively borrows from you.',
      suggestion:'Ask for net-30, or 50% upfront.'}); }
  if(T.revisions>=3){ const c=clauseOf(C,/revision/i);
    add({key:'revisions',sev:'MEDIUM',title:sp(T.revisions)[0].toUpperCase()+sp(T.revisions).slice(1)+' revision rounds',clause:c&&c.ref?'clause '+c.ref:'in your message',quote:quoteFrom(c,/up to[^.]*revisions[^.]*|revisions?[^.]*/i)||T.revisions+' rounds',
      line:'Extra creative labour at no extra fee, with no cap on scope.',
      reading:'The brand can ask for '+T.revisions+' rounds of changes.',
      consequence:'Additional creative labour at no additional fee, with no cap on scope per round.',
      suggestion:'Limit to one round, then charge for further rounds.'}); }
  if(T.paid && !T.perp){ const c=clauseOf(C,/paid|whitelist/i);
    add({key:'paidmedia',sev:'MEDIUM',title:'Paid media rights',clause:c&&c.ref?'clause '+c.ref:'in your message',quote:quoteFrom(c,/paid[^.]*/i)||'paid ads',line:'Content can run as ads; the duration is not given.',reading:'The brand can run your content as paid advertising.',consequence:'This is an advertising licence. CreVa prices it at about ₹10,000 on top of content, and the duration is not stated.',suggestion:'Name a duration for paid use and a fee for it.'}); }
  if(T.barter){
    const pct=T.productValue&&A.indicative?Math.round(T.productValue/A.indicative*100):null;
    add({key:'barter',sev:'HIGH',title:'Barter only, no cash',clause:'in your message',quote:'in exchange for ... product',line:'Product'+(T.productValue?' valued at '+INR(T.productValue):'')+' against '+INR(A.indicative)+' of reference content value.',reading:'You deliver paid-scale content and receive product.',consequence:(T.productValue?'The product covers about '+pct+'% of reference content value. ':'')+'CreVa does not know your production cost, but a product you may not use cannot pay for the time. "Exposure" is not a payment term.',suggestion:'Ask for a cash fee and treat the product as a bonus, or cut scope to one Reel.'}); }
  if(T.ipAssign) add({key:'ip',sev:'HIGH',title:'Outright assignment of rights',clause:'see contract',quote:'assigns ... rights',line:'You hand over ownership, not a licence.',reading:'Ownership of the content moves to the brand.',consequence:'You may lose the right to reuse your own content in your portfolio or elsewhere.',suggestion:'Ask for a licence with a term instead of an assignment.'});
  if(P.isOther && P.engagement!=null && P.engagement<1 && P.followers){
    const inter=Math.round(P.followers*P.engagement/100);
    add({key:'engagement',sev:'HIGH',title:'Engagement of '+P.engagement+'% is low for '+P.followers.toLocaleString('en-IN')+' followers',clause:'in your message',quote:P.engagement+'% engagement',line:'About '+inter.toLocaleString('en-IN')+' interactions per post on average.',reading:'Very few followers interact with your posts.',consequence:'A brand paying for '+P.followers.toLocaleString('en-IN')+' followers is buying an audience where about '+inter.toLocaleString('en-IN')+' people interact per post. Expect them to ask for reach and view proof, and expect follower count alone not to hold a price.',suggestion:'Share average views per Reel, saves and shares per 1K views, and any closed deals so CreVa can range this.'});
  }
  if(T.usageDays!=null && T.usageDays>=90 && !T.perp && !T.paid){
    add({key:'usage',sev:'LOW',title:Math.round(T.usageDays/30)+'-month organic usage',clause:'in your message',quote:Math.round(T.usageDays/30)+' months',line:'Brand reposts for '+Math.round(T.usageDays/30)+' months on its own channels.',reading:'Organic reposting by the brand for '+Math.round(T.usageDays/30)+' months.',consequence:'Reasonable for organic use. A cap at 90 days, or a small fee for extension, is a minor counter.',suggestion:'Offer 90 days with a renewal fee.'});
  }
  if(T.indemnity){ const c=clauseOf(C,/indemnif|indemnity|hold harmless/i);
    add({key:'indemnity',sev:'HIGH',title:'Indemnity obligation',clause:c&&c.ref?'clause '+c.ref:(C?'clause not located':'in your message'),quote:quoteFrom(c,/indemnif[^.]*|indemnity[^.]*|hold harmless[^.]*/i)||'indemnity',
      line:'You may have to cover the brand\'s losses and legal costs.',reading:'If someone makes a claim about the content, you may be asked to pay the brand\'s costs and losses.',
      consequence:'A claim about your content could turn into a bill you pay, on top of a fee that does not price that risk.',
      suggestion:'Ask to cap it at the fee you receive, limit it to claims caused by your own content, and have a lawyer read it before you sign.'}); }
  if(T.liability){ const c=clauseOf(C,/liabilit|uncapped|damages/i);
    add({key:'liability',sev:'HIGH',title:'Liability or damages terms',clause:c&&c.ref?'clause '+c.ref:(C?'clause not located':'in your message'),quote:quoteFrom(c,/[^.]*(?:liabilit|uncapped|damages)[^.]*/i)||'liability',
      line:'Liability may be uncapped or one-sided.',reading:'The text mentions liability or damages. CreVa cannot tell who carries the risk or how far it goes.',
      consequence:'If liability is not capped, one dispute could cost you far more than the fee you were paid.',
      suggestion:'Ask for liability to be capped at the fee, and have a lawyer read this clause before you sign.'}); }
  if(T.tax){ const c=clauseOf(C,/\b(?:tds|gst|tax)/i);
    add({key:'tax',sev:'LOW',title:'Tax terms (GST or TDS)',clause:c&&c.ref?'clause '+c.ref:(C?'clause not located':'in your message'),quote:quoteFrom(c,/[^.]*\b(?:tds|gst|tax)[^.]*/i)||'tax',
      line:'Who bears GST or TDS changes what you actually receive.',reading:'The text mentions tax. It may change the amount that reaches your account.',
      consequence:'If tax is deducted, or GST is not added on top of the fee, you receive less than the headline number.',
      suggestion:'Confirm with a CA how GST and TDS apply, and ask for the fee to be stated plus GST if you are registered.'}); }
  const VAL={perpetual:'Not in the indicative value. About '+INR(15000)+' if priced as a separate licence.',
    exclusivity:T.exclMonths>0?'+'+INR(Math.round(T.exclMonths*2000))+' at CreVa\'s reference rate':'',
    payment:T.payDays>=90?'-'+INR(2000)+' cash-flow cost':(T.payDays>=60?'-'+INR(1000)+' cash-flow cost':''),
    revisions:T.revisions>1?'+'+INR((T.revisions-1)*1500):'',paidmedia:'+'+INR(10000),usage:'+'+INR(6000),
    ip:'Not priced. Needs a lawyer.',indemnity:'Not priced. Needs a lawyer.',liability:'Not priced. Needs a lawyer.',tax:'Not priced. Check with a CA.',
    barter:T.productValue?INR(T.productValue)+' of product, no cash':'No cash fee'};
  A.risks.forEach(r=>{ if(!r.value&&VAL[r.key]) r.value=VAL[r.key]; });
  A.risks.sort((a,b)=>SEVR[b.sev]-SEVR[a.sev]);

  if(T.raw) A.noted.push('Raw footage and project files handover (priced at about '+INR(4000)+' if included)');
  // unknowns
  if(T.paid && !T.paidDur) A.unknown.push('Paid media duration is not specified.');
  if(!con) A.unknown.push('No contract was provided, so only the message could be read. Clause-level risks may be missing.');
  if(T.payDays==null) A.unknown.push('Payment timing is not stated.');
  if(!T.perp && T.usageDays==null && !T.barter) A.unknown.push('Usage duration is not stated.');
  if(!T.exclMentioned) A.unknown.push('Exclusivity is not mentioned. Confirm none applies.');
  if(P.isOther && !P.followers) A.unknown.push('Your own closed deals and average views are not known, so this rests on CreVa\'s reference model.');
  if(P.isOther && P.followers) A.unknown.push('Average views per Reel, saves and shares per 1K views, and any closed deals.');
  if(T.barter && !T.productValue) A.unknown.push('Product value is not stated.');
  if(!hasDeliv) A.unknown.push('Deliverables are not stated, so the content cannot be priced.');
  if(P.isOther && P.never) A.unknown.push('Which platform audience and seniority the post would reach is not given.');

  // verdict
  const hasPerp=T.perp;
  if(T.barter) A.headline='Barter value is about '+(T.productValue&&A.indicative?Math.round(T.productValue/A.indicative*100):'a small share of')+(T.productValue&&A.indicative?'%':'')+' of reference content value.';
  else if(A.lockout) A.headline='The '+A.lockout.months+'-month exclusivity is the issue here: it blocks every '+A.lockout.category+' offer for '+A.lockout.months+' months and is worth about '+INR(A.lockout.amount)+' on its own at CreVa\'s reference rate'+(A.ask!=null?', and the '+INR(A.ask)+' fee does not say what content it buys':'')+'. CreVa cannot price the content without the deliverables.';
  else if(A.rangeUnavailable) A.headline='CreVa cannot range this offer from what was given.';
  else if(P.isOther && P.followers && P.engagement!=null && P.engagement<1) A.headline='Follower count does not set this price. '+P.engagement+'% engagement is the first thing a brand will question. CreVa\'s directional range for one Reel is '+INR(A.low)+' to '+INR(A.high)+' (Tier 3, Low confidence), and it is not scaled to your followers.';
  else if(hasPerp) A.headline='The licence, not the fee, is the headline issue. The fee prices content; the contract also grants an advertising licence with no end date.'+(A.ask!=null&&A.low!=null&&A.ask<A.low?' The fee is also '+INR(A.low-A.ask)+' below range.':'');
  else if(A.confidence==='Low'&&A.ask!=null&&A.low!=null) A.headline=(A.ask>=A.low&&A.ask<=A.high?INR(A.ask)+" sits inside CreVa's directional range":INR(A.ask)+" sits outside CreVa's directional range")+', but confidence is Low: no deal history was given.';
  else if(A.ask!=null && A.ask>=A.low) A.headline='Priced fairly for this scope. '+(A.risks.length?'One minor point to counter.':'No material risks found.');
  else if(A.ask!=null) A.headline='The offer is '+INR(A.low-A.ask)+' to '+INR(A.indicative-A.ask)+' below the range for this scope.';
  else A.headline='No fee was found in the message.';
  A.escalateWhy=[];
  if(T.ipAssign) A.escalateWhy.push('the contract assigns your rights outright');
  if(T.indemnity) A.escalateWhy.push('it asks you to indemnify the brand');
  if(T.liability) A.escalateWhy.push('it mentions liability or damages');
  if(T.perp) A.escalateWhy.push('the usage licence has no end date');
  if(A.ask!=null && A.ask>=25000) A.escalateWhy.push('the deal value is high');
  A.taxNote=!!T.tax;
  A.escalate = A.escalateWhy.length>0;
  A.counter={};
  if(A.indicative>0){
    const ask0=A.ask||0;
    A.counter.max=Math.max(A.indicative-2000, ask0);
    A.counter.rel=Math.max(Math.round(A.indicative*0.79/1000)*1000, ask0);
    A.counter.pres=(A.low!=null&&ask0>=A.low)?ask0:ask0+2000;
  }
  // Barter: the cash-ask. Full scope at the reference rate, or a reduced scope (one Reel and up to two Stories) where the product counts toward the price.
  if(T.barter && A.indicative>0){
    const prod=T.productValue||0, st=Math.min(T.stories||0,2), reducedValue=38000+st*3000;
    A.barterAsk={product:prod, share:prod&&A.indicative?Math.round(prod/A.indicative*100):null, cash:A.counter.max,
      reducedLabel:'one Reel'+(st>1?' and two Stories':(st===1?' and one Story':'')), reducedCash:Math.max(reducedValue-prod,0), reducedValue};
  }
  A.terms=buildTermChips(A);
  return A;
}

function buildTermChips(A){
  const T=A.T, ch=[];
  ch.push({k:'Deliverables',v:A.delivText});
  ch.push({k:'Usage scope',v:T.perp?'Perpetual, worldwide':(T.usageDays!=null?(T.usageDays>=60?Math.round(T.usageDays/30)+' months':T.usageDays+' days'):'Not stated'),f:T.perp?'high':''});
  ch.push({k:'Paid media',v:T.paid?(T.paidDur?'Yes':'Yes, duration not stated'):'None found',f:T.paid?'med':''});
  const m=T.exclMonths;
  ch.push({k:'Exclusivity',v:T.exclNone?'None':(m>0?Math.round(m*10)/10+' months, category':(m===-1?'Yes, length not stated':'Not mentioned')),f:m>=3?'high':(m!==0&&!T.exclNone?'med':'')});
  ch.push({k:'Revisions',v:T.revisions!=null?T.revisions+(T.revisions>1?' rounds':' round'):'Not stated',f:T.revisions>=3?'med':''});
  ch.push({k:'Raw assets',v:T.raw?'Handover required':'Not requested',f:T.raw?'med':''});
  ch.push({k:'Payment',v:T.payDays!=null?'Net-'+T.payDays:'Not stated',f:T.payDays>=90?'med':''});
  return ch;
}

function missingTerms(con){
  if(!con) return [];
  const t=con.toLowerCase(), out=[];
  const chk=(re,term,why)=>{ if(!re.test(t)) out.push({term,why}); };
  chk(/kill fee|cancell?ation|cancel/,'Kill fee or cancellation terms','The brand can cancel after you have produced the content and owe you nothing.');
  chk(/late payment|interest|late fee/,'Late-payment interest','Nothing compensates you if the 90 days is exceeded.');
  chk(/disclos|#ad|paid partnership|asci/,'Paid partnership disclosure','No clause says how the partnership is labelled. Disclosure is still required on your posts.');
  chk(/terminat/,'Termination rights','No way to exit the agreement or end the licence.');

  chk(/extension|renewal|additional fee|separate fee/,'Fee for extra usage','No mechanism to be paid if the brand wants more usage later.');

/* Free rate checker model (reference model, labelled as such) */
function checkRate(f){
  const li=f.platform==='LinkedIn';
  const D={reel:{n:'1 Reel',b:38000},reel3:{n:'1 Reel + 3 Stories',b:47000},st3:{n:'3 Stories',b:9000},li1:{n:'1 LinkedIn post',b:22000},li2:{n:'2 LinkedIn posts',b:44000},linl:{n:'1 LinkedIn post + 1 newsletter mention',b:40000}};
  const d=D[f.deliver]||D[li?'li1':'reel'];
  const refAud=li?18000:54000;
  const hasLast=f.last>0;
  const engF=(f.eng!=null && f.eng<1)?0.75:1;
  const sizeF=Math.min(2.5,Math.max(0.35,Math.pow((f.followers||refAud)/refAud,0.6)));
  const scale=hasLast?(f.last/d.b):sizeF*engF;
  const usage={org30:0,org90:6000,paid:10000,perp:10000}[f.usage]||0;
  const excl={none:0,m1:1,m3:3,m6:6}[f.excl]||0;
  const rightsRef=usage+excl*2000;
  const content=d.b*scale, rights=rightsRef*scale;
  const mid=content+rights;
  const lo=hasLast?0.9:0.7, hi=hasLast?1.12:1.2;
  const r=n=>Math.round(n/500)*500;
  const drivers=[['Content ('+d.n+')',r(content)]];
  if(usage&&f.usage!=='org90')drivers.push(['Paid media usage',r(10000*scale)]);
  if(f.usage==='org90')drivers.push(['90-day usage',r(6000*scale)]);
  if(excl)drivers.push([excl+'-month exclusivity',r(excl*2000*scale)]);
  const narrow=[];
  if(!hasLast)narrow.push('A comparable deal you were paid for. This is the single biggest narrowing step.');
  narrow.push('Average views or reach on your last five '+(li?'posts':'Reels')+', not just follower count.');
  if(f.eng==null)narrow.push('Your engagement rate.');
  narrow.push(li?'Who sees your posts: seniority, industry and company size of your audience.':'Non-follower reach, and saves and shares per 1K views.');
  if(f.usage==='paid'||f.usage==='perp')narrow.push('How long the brand can run it as an ad, and in which markets.');
  return {low:r(mid*lo),high:r(mid*hi),mid:r(mid),conf:'Low',tier:hasLast?'Tier 1 · 1 deal you reported (under 5, so confidence stays Low)':'Tier 3 · no deals given',deliv:d.n,drivers,narrow,perpNote:f.usage==='perp'?'Perpetual usage is not in this range. It needs its own licence fee or a fixed end date.':'',li};
}

function mergeAI(E, a){

function spark(pts){
  const w=120,h=38,mx=Math.max(...pts),mn=Math.min(...pts);
  const xy=pts.map((p,i)=>[i/(pts.length-1)*w,h-5-(p-mn)/(mx-mn||1)*(h-12)]);
  const d=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const l=xy[xy.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function bars(v){ const mx=Math.max(...v); return `<svg width="64" height="44" viewBox="0 0 64 44" aria-hidden="true">${v.map((x,i)=>`<rect x="${i*14}" y="${44-x/mx*40}" width="9" height="${x/mx*40}" rx="3" fill="var(--accent)" opacity="${.45+i*.16}"/>`).join('')}</svg>`; }

function upsertContract(){

  S.cid=c.id; saveContract(c); return c;

function openContract(id){
  const c=S.contracts.find(x=>x.id===id); if(!c) return;
  S.cid=id; S.brandName=c.brand; S.msg=c.msg||''; S.con=c.text; S.file=c.file; S.cur=OFFERS[id]?id:'blank';
  S.A=analyze(S.msg,S.con); S.special=null; S.C=null; S.mode=''; S.draft=''; S.draftDirty=false; S.cMode='max'; setDraft();

/* issue states: open | reviewed | cleared | dismissed (kept per contract, drives every screen that shows this brand) */
const stOf=(c,k)=>(c.states&&c.states[k])||'open';
function cRisks(c){ return analyze(c.msg||'',c.text).risks; }
function cCounts(c){ const R=cRisks(c), o={open:0,reviewed:0,cleared:0,dismissed:0,high:0,total:R.length}; R.forEach(r=>{ const s=stOf(c,r.key); o[s]++; if(s==='open'&&r.sev==='HIGH') o.high++; }); return o; }
function cStatus(c){ const n=cCounts(c); if(c.status==='Signed') return 'Signed'; if(!n.total) return 'Clear'; if(n.open>0) return (n.reviewed+n.cleared+n.dismissed)>0?'In review':'Needs review'; return n.reviewed>0?'Reviewed':'Cleared'; }
const STCLS={Signed:'ok',Clear:'ok',Cleared:'ok',Reviewed:'acc','In review':'med','Needs review':'med',Reviewed2:'acc'};
const ISL={reviewed:'Reviewed',cleared:'Cleared',dismissed:'Dismissed'};
const ISC={reviewed:'acc',cleared:'ok',dismissed:'low'};
const brandContract=()=>S.contracts.find(x=>x.brand.toLowerCase()===brandOf().toLowerCase()&&x.file===(S.file||'Pasted contract'));
const riskLive=k=>{ const c=brandContract(); if(!c) return true; const s=stOf(c,k); return s==='open'||s==='reviewed'; };
const stTag=k=>{ const c=brandContract(); if(!c) return ''; const s=stOf(c,k); return s==='open'?'':`<span class="sev ${ISC[s]}">${ISL[s]}</span>`; };
function softRender(){ S._static=true; try{ render(false); } finally{ S._static=false; } }
function setIssue(k,s){
  const c=S.contracts.find(x=>x.id===S.cid); if(!c) return;
  c.states=c.states||{}; if(c.states[k]===s||s==='open') delete c.states[k]; else c.states[k]=s; saveContract(c);
  if(S.A&&!S.draftDirty) setDraft();
  softRender();
  const n=cCounts(c); toast(n.open?`${n.open} left to review for ${c.brand}`:`All ${c.brand} issues are handled`);
}

/* negotiate */
function joinList(a){ return a.length>1?a.slice(0,-1).join(', ')+' and '+a[a.length-1]:(a[0]||''); }
function drivers(A){ const T=A.T, d=[];
  if(T.perp){ if(riskLive('perpetual')) d.push(T.paid?'perpetual paid usage':'perpetual usage'); } else if(T.paid){ if(riskLive('paidmedia')) d.push('paid media rights'); }
  if(T.exclMonths>0&&riskLive('exclusivity')) d.push(Math.round(T.exclMonths*10)/10+' months of category exclusivity');
  if(T.revisions>=3&&riskLive('revisions')) d.push(sp(T.revisions)+' revision rounds');
  if(T.raw) d.push('raw footage handover');
  if(T.payDays>=60&&riskLive('payment')) d.push('net-'+T.payDays+' payment');
  return d; }
const DISC='All posts will carry the paid partnership label.';
function draftFor(mode, A, brand){
  const c=A.counter, ask=A.ask||0, dl=A.delivWords, dr=drivers(A);
  const drv=dr.length?joinList(dr):'the usage and terms as written';
  const raw=A.T.raw?', no raw footage':'';
  if(mode==='max') return `Thanks for sharing the brief, and I'd love to work on this. For ${dl} my rate for the package as written is ${INR(c.max)}, which reflects ${drv} alongside the content itself. ${ask?`If the budget needs to stay closer to ${INR(ask)}, I can make that work with organic usage for thirty days, exclusivity limited to thirty days, and one round of revisions${raw}. `:''}Happy to go either way, let me know which suits.\n\n${DISC}`;
  if(mode==='rel') return `Thank you for thinking of me for this, I'm glad to be part of the launch. For ${dl} I'd suggest ${INR(c.rel)}. At that figure I can include ninety days of organic usage, two rounds of revisions and payment on net-45.${dr.length?` The ${joinList(dr.filter(x=>!/net-/.test(x)))||'wider rights'} would need to come out of this package or be quoted separately, since they sit outside a standard content fee.`:''} I'd like us to work together beyond one campaign, so I'm open to talking through what matters most to you.\n\n${DISC}`;
  return `Thanks again for the offer. I'm happy to keep to your budget of ${INR(c.pres)} for ${dl}. At that figure the package is organic usage only, thirty days of exclusivity, one round of revisions${raw} and payment on net-30. If you'd like wider usage, longer exclusivity or more revisions, I can quote those separately and we can add them as you need them.\n\n${DISC}`;
}
const MODES={max:{n:'Maximize value',sub:(A)=>`Rights preserved. Offers a reduced-scope path at their budget.`,trade:'Holds price. Trades nothing on rights unless they cut the budget, then 30-day organic usage, 1 revision, net-30.'},
  rel:{n:'Protect relationship',sub:()=>`Warmer language. 90-day usage, 2 revisions, net-45.`,trade:'Gives on price and terms to keep the door open; wider rights are quoted separately.'},
  pres:{n:'Preserve budget',sub:()=>`Keeps their number and shrinks what they get. Organic usage only, 30-day exclusivity, 1 revision, no raw footage.`,trade:'Does not move the brand\'s budget. Moves what the budget buys.'}};

// Barter: gifting versus paid. The first ask for money, as a draft the creator edits and sends herself.

function setDraft(){ const A=S.A; if(!A||!A.counter||!A.counter.max)return; const brand=brandOf(); S.draft=(A.T.barter&&A.barterAsk)?barterDraft(A,brand):draftFor(S.cMode,A,brand); S.draftDirty=false; }
async function aiDraft(extra){
  const A=S.A; if(!A||!A.counter||!A.counter.max||S.nbusy||A.T.barter) return; S.nbusy=true; softRender();
  const mode=S.cMode, price={max:A.counter.max,rel:A.counter.rel,pres:A.counter.pres}[mode], base=draftFor(mode,A,'');
  try{
    let d='';
    if(inArtifact()){
      const r=await ai('Write the negotiation draft for the creator to send themselves. Mode: '+MODES[mode].n+'. Price: '+INR(price)+'. Keep every numeric term from the starting draft. Name the terms that drive the number. Include the paid partnership disclosure line. Never write that anything has been sent or accepted. '+(extra?'Creator instruction: '+extra+'.':''),
        'STARTING DRAFT:\n'+(extra&&S.draft?S.draft:base)+'\n\nTERMS:\n'+JSON.stringify(A.terms),'{"draft":string}');
      d=typeof r.draft==='string'?r.draft.trim():'';
      S.mdl={provider:'Claude',model:''};
    } else if(useApi()){
      const r=await apiAi('negotiate',{brand:brandOf(),message:S.msg||('Offer from '+brandOf()),contract:S.con,mode,instruction:extra||'',draft:extra?S.draft:'',context:aiContext()});
      if(r.source==='rule'){ S.refused=true; S.nbusy=false; softRender(); return; } // an instruction asking to send/accept is refused on the server too
      d=r.result.draft;
    } else throw new ApiFail('offline');
    if(d.length<80||d.length>1800||!d.includes(INR(price).replace('₹',''))) throw new ApiFail('upstream_error');
    if(!/paid partnership/i.test(d)) d+='\n\n'+DISC;

    S.nmode='live'; S.nreason='';
  }catch(err){ S.nmode='fallback'; S.nreason=reasonOf(err); logFallback('negotiate',err); if(extra) toast('Live model unavailable ('+S.nreason+'), so the draft was not rewritten. Edit it by hand.'); }
  S.nbusy=false; if(S.route==='negotiate') softRender();
}

function autopsyView(){
  const p=POSTS.find(x=>x.id===S.post), R=S.auto[p.id];
  const f=v=>(v>0?'+':(v<0?'-':''))+Math.abs(v)+'%';
  const rows=[['Reach',p.m.reach],['First 3s retention',p.m.ret3],['Saves per 1K',p.m.saves],['Shares per 1K',p.m.shares]];
  return `<div class="card pad stack"><div><label class="f" for="postsel">Post</label><select id="postsel" data-a-change="post">${POSTS.map(x=>`<option value="${x.id}" ${x.id===S.post?'selected':''}>${x.date} · ${x.title}</option>`).join('')}</select></div>
   <div class="tw"><table><tr><th>Metric</th><th>Versus your median</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td class="num ${r[1]<=-20?'':'muted'}" style="${r[1]<=-20?'color:var(--high);font-weight:500':''}">${f(r[1])}</td></tr>`).join('')}<tr><td>Posting time</td><td>${p.win}</td></tr></table></div>
   <div><button class="btn p" data-a="autopsy" ${S.abusy?'disabled':''}>${S.abusy?'Reading the data':'Why did this one flop?'}</button></div></div>
   ${R?`<div class="sec"><h2>CreVa's answer</h2><div class="card pad stack">
     <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center"><span class="sev ${R.conf==='INSUFFICIENT EVIDENCE'?'acc':'med'}">Confidence: ${esc(R.conf)}</span></div>
     <p style="font-size:17px;max-width:68ch;text-wrap:pretty">${esc(R.answer)}</p>
     <div class="grid g3"><div><div class="lab">Evidence</div><ul style="margin:0;padding-left:18px">${R.observed.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
       <div><div class="lab">Inference${R.hyp.length?' (not proven)':''}</div><ul style="margin:0;padding-left:18px">${(R.hyp.length?R.hyp:['None. The data cannot separate a distribution cause from a content cause.']).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
       <div><div class="lab">Unknown</div><ul style="margin:0;padding-left:18px">${['Algorithm or distribution changes (CreVa cannot see them)','Whether your audience was online when you posted'].concat(R.kind==='ins'?['Data that would help: retention beyond the first 3 seconds, and reach split by followers and non-followers']:[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
     <div class="status">${R.mode==='live'?'<span class="dot ok"></span>'+esc(liveTag())+' answer, checked against the data rules.':'<span class="dot amber"></span>Fallback engine, not the live model ('+esc(S.reason)+').'}</div></div></div>`:''}`;
}
function autopsyRule(p){
  const m=p.m;
  if(m.ret3<=-20) return {conf:'LOW',answer:`First-3-second retention is ${Math.abs(m.ret3)}% below your median, which is consistent with weaker early retention. I can't establish that it caused the lower reach. Reach is down ${Math.abs(m.reach)}%, and retention is only one of several things that move it.`,observed:[`Reach ${m.reach}% versus median`,`First 3s retention ${m.ret3}%`,`Saves per 1K ${m.saves}%, shares per 1K ${m.shares}%`,'Posted in your normal window'],hyp:['Weaker early retention may have reduced how widely the Reel was shown. Consistent with the data, not proven.'],kind:'hyp'};
  return {conf:'INSUFFICIENT EVIDENCE',answer:`I don't have enough evidence to identify why this post underperformed. Reach is well below your median, but retention, saves, shares and posting time are all within your normal range. I can't distinguish a distribution cause from a content cause with the data available.`,observed:[`Reach ${m.reach}% versus median`,`First 3s retention ${m.ret3}%, within normal range`,`Saves per 1K ${m.saves}%, shares per 1K ${m.shares}%, within normal range`,'Posted in your normal window'],hyp:[],kind:'ins'};
}

function go(r){ S.route=r; if(r==='negotiate'&&!S.draft) setDraft(); render(); if(r==='contracts') ensureContract(); }

async function ensureContract(){
  const A=S.A; if(!A||!A.con||S.C||S.cbusy) return;
  S.cbusy=true; render(false);
  try{
    const risks=JSON.parse(JSON.stringify(A.risks)); let missing=missingTerms(A.con);
    if(inArtifact()){
      const r=await ai('Contract review. For each issue, rewrite the plain-English reading and the commercial consequence for this creator specifically. Also list up to 6 standard creator-agreement terms that are absent from the contract. Do not reach any legal conclusion. Do not change the number of issues.',
        'CONTRACT:\n'+A.con+'\n\nISSUES:\n'+JSON.stringify(A.risks.map(r=>({key:r.key,sev:r.sev,title:r.title,clause:r.clause,quote:r.quote,reading:r.reading,consequence:r.consequence}))),
        '{"issues":[{"key":string,"reading":string,"consequence":string}],"missing":[{"term":string,"why":string}]}');
      risks.forEach(k=>{ const x=Array.isArray(r.issues)&&r.issues.find(y=>y&&y.key===k.key); if(x){ if(typeof x.reading==='string'&&x.reading.length>10&&x.reading.length<300)k.reading=x.reading; if(typeof x.consequence==='string'&&x.consequence.length>10&&x.consequence.length<340)k.consequence=x.consequence; } });
      if(Array.isArray(r.missing)&&r.missing.length&&r.missing.every(m=>m&&typeof m.term==='string'&&typeof m.why==='string')) missing=r.missing.slice(0,6);
      S.mdl={provider:'Claude',model:''};
    } else if(useApi()){
      const d=await apiAi('contract',{brand:brandOf(),message:S.msg||('Contract review for '+brandOf()),contract:A.con,context:aiContext()});
      if(d.source!=='live') throw new ApiFail('upstream_error');
      const r=d.result;
      risks.forEach(k=>{ const x=(r.issues||[]).find(y=>y&&y.key===k.key); if(x){ k.reading=x.reading; k.consequence=x.consequence; k.suggestion=x.suggestion; } });
      if(Array.isArray(r.missing)&&r.missing.length) missing=r.missing.slice(0,6);
    } else throw new ApiFail('offline');
    S.C={risks,missing}; S.cMode='live';
  }catch(err){ S.C={risks:A.risks,missing:missingTerms(A.con)}; S.cMode='fallback'; S.reason=reasonOf(err); logFallback('contract',err); }
  S.cbusy=false; if(S.route==='contracts') render(false);
}

function loadOffer(id){
  if(id==='blank'){ Object.assign(S,{brandName:'',site:'',cur:'blank',msg:'',con:'',file:'',A:null,special:null,C:null,mode:'',draft:''}); return; }
  const o=OFFERS[id]; Object.assign(S,{brandName:o.brand,site:'',cur:id,msg:o.msg,con:o.con,file:o.file,A:null,special:null,C:null,mode:'',draft:'',draftDirty:false,cMode:'max'});
}
function quickAnalysis(id){ loadOffer(id); S.A=analyze(S.msg,S.con); S.mode=''; setDraft(); }

  else if(a==='topic-add'){ const e=$('#topic_other'), v=(e?e.value:'').trim(); if(v.length<2){ toast('Type a topic first.'); return; } const arr=S.profile.subs; if(!arr.some(x=>x.toLowerCase()===v.toLowerCase())) arr.push(v); S.dirty=true; render(false); setTimeout(()=>{ const n=$('#topic_other'); if(n) n.focus(); },50); toast('Added '+v); }
  else if(a==='pf-toggle'){ S.profile[b.dataset.k]=!S.profile[b.dataset.k]; S.dirty=true; b.setAttribute('aria-checked',String(S.profile[b.dataset.k])); const si=$('#saveinfo'); if(si) si.textContent='You have unsaved changes.'; }
  else if(a==='chip'){ const arr=S.profile[b.dataset.k], v=b.dataset.v, i=arr.indexOf(v); if(i<0) arr.push(v); else arr.splice(i,1); S.dirty=true; b.setAttribute('aria-pressed',String(i<0)); if(i>=0&&!SUBS.includes(v)&&!LANGS.includes(v)){ S.dirty=true; render(false); return; } const si=$('#saveinfo'); if(si) si.textContent='You have unsaved changes.'; updProf(); }

async function runAutopsy(){
  if(S.abusy) return;
  const p=POSTS.find(x=>x.id===S.post), rule=autopsyRule(p); S.abusy=true; render(false);
  let out=Object.assign({mode:'fallback'},rule);
  try{
    if(inArtifact()){
      const a=await ai('Post autopsy. Explain why the post underperformed ONLY if the data supports it. Separate observed metrics from hypotheses. If retention, saves, shares and posting time are within the creator\'s normal range, say you do not have enough evidence and set confidence to INSUFFICIENT EVIDENCE. Never blame the hook, the algorithm, posting time or the audience without evidence, and never state a cause as fact.',
        JSON.stringify({post:p.title,date:p.date,vsMedianPercent:p.m,postingWindow:p.win,ruleOutcome:rule.kind==='ins'?'insufficient evidence':'retention is a hypothesis only'}),
        '{"confidence":"INSUFFICIENT EVIDENCE|LOW","answer":string,"observed":[string],"hypotheses":[string]}');
      const ok=typeof a.answer==='string'&&a.answer.length>30&&a.answer.length<700&&Array.isArray(a.observed)&&a.observed.length
        &&!/\bbecause\b|due to|caused by|the algorithm|shadow ?ban/i.test(a.answer)
        &&(rule.kind==='ins'?(a.confidence==='INSUFFICIENT EVIDENCE'&&(!Array.isArray(a.hypotheses)||!a.hypotheses.length)):(a.confidence==='LOW'&&/can'?not|can't|unable|not establish|not proven/i.test(a.answer)));
      if(!ok) throw new ApiFail('upstream_error');
      S.mdl={provider:'Claude',model:''};
      out={mode:'live',conf:a.confidence,answer:a.answer,observed:a.observed.slice(0,5).map(String),hyp:rule.kind==='ins'?[]:(a.hypotheses||[]).slice(0,3).map(String),kind:rule.kind};
    } else if(useApi()){
      const d=await apiAi('autopsy',{message:'',context:{metrics:p.m,post:p.title,window:p.win}});
      if(d.source!=='live') throw new ApiFail('upstream_error');
      const a=d.result; // the server already rejected blame language and a wrong confidence level
      out={mode:'live',conf:a.confidence,answer:a.answer,observed:a.observed,hyp:a.hypotheses,kind:a.kind};
    } else throw new ApiFail('offline');
  }catch(err){ S.reason=reasonOf(err); logFallback('autopsy',err); }
  S.auto[p.id]=out; S.abusy=false; if(S.route==='growth') render(false);
}

async function runCheck(){
  if(S.chkBusy) return;
  const c=S.chk; const f={platform:c.platform,followers:+c.followers||null,eng:c.eng===''?null:+c.eng,deliver:c.deliver,usage:c.usage,excl:c.excl,last:+c.last||0};
  const o=checkRate(f); S.chkOut=o; S.shared=false; S.done.checker=1; S.chkBusy=true; S.chkMode=''; render(false);
  try{
    let narrow=null;
    if(inArtifact()){
      const a=await ai('Free rate check for an anonymous creator who is NOT '+S.profile.name+'; ignore the saved profile. Use only the inputs given. Do not use follower count as the sole variable. Write 3 to 5 short, specific items on what would narrow this range. Confidence is '+o.conf+' and must not change.',
        JSON.stringify({inputs:f,niche:c.niche,range:[o.low,o.high],evidence:o.tier,drivers:o.drivers}),'{"narrow":[string]}');
      narrow=a.narrow; S.mdl={provider:'Claude',model:''};
    } else if(useApi()){
      const d=await apiAi('checker',{message:'',context:{checker:f}});
      if(d.source!=='live') throw new ApiFail('upstream_error');
      narrow=d.result.narrow;
    } else throw new ApiFail('offline');
    if(Array.isArray(narrow)&&narrow.length>=2&&narrow.every(x=>typeof x==='string'&&x.length>10&&x.length<220)){ o.narrowAI=narrow.slice(0,5); S.chkMode='live'; } else throw new ApiFail('upstream_error');
  }catch(err){ S.chkMode='fallback'; S.reason=reasonOf(err); logFallback('checker',err); }
  S.chkBusy=false; if(S.route==='checker') render(false);
}

/* ---- speech to text ---- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let REC=null, RECEL=null;
S.lang='en-IN';
function normSpeech(t){
  return t.replace(/(\d+(?:\.\d+)?)\s*(thousand|lakhs?|crore)\b/gi,(m,n,u)=>String(Math.round(parseFloat(n)*({thousand:1e3,lakh:1e5,lakhs:1e5,crore:1e7}[u.toLowerCase()]))))
          .replace(/(\d[\d,]*(?:\.\d+)?)\s*(?:rupees|rupee|rs\.?|inr)\b/gi,'₹$1');
}
function stopDict(){
  if(REC){ try{ REC.onend=null; REC.onerror=null; REC.stop(); }catch(e){} }
  REC=null; RECEL=null;
  document.querySelectorAll('.mic.on').forEach(b=>{ b.classList.remove('on'); b.setAttribute('aria-pressed','false'); });
  document.querySelectorAll('.dstat').forEach(d=>{ d.textContent=''; });
}
function startDict(btn){
  const w=btn.closest('.dict'), el=w.querySelector('textarea,input'), st=w.querySelector('.dstat');
  if(!SR){ toast('Speech input is not supported in this browser. Try Chrome or Edge, or type instead.'); return; }
  if(REC&&RECEL===el){ stopDict(); return; }
  stopDict();
  const r=new SR(); r.lang=S.lang; r.continuous=true; r.interimResults=true;
  const isNum=el.type==='number', base=isNum?'':el.value; let fin='';
  const join=(a,b)=>!a?b:(!b?a:(/\s$/.test(a)?a+b:a+' '+b));
  r.onresult=ev=>{
    let interim=''; for(let i=ev.resultIndex;i<ev.results.length;i++){ const tr=ev.results[i][0].transcript; if(ev.results[i].isFinal) fin=join(fin,tr.trim()); else interim+=tr; }
    const spoken=normSpeech(fin);
    if(isNum){ const m=normSpeech(fin+' '+interim).replace(/₹/g,'').match(/\d[\d,]*(?:\.\d+)?/); if(m){ el.value=m[0].replace(/,/g,''); el.dispatchEvent(new Event('input',{bubbles:true})); } }
    else { el.value=join(base,spoken); if(el.tagName==='TEXTAREA') el.scrollTop=el.scrollHeight; el.dispatchEvent(new Event('input',{bubbles:true})); }
    st.textContent='Listening: '+(normSpeech(interim)||'speak now')+'  (tap the mic to stop)';
  };
  r.onerror=ev=>{
    const e=ev.error; stopDict();
    toast(e==='not-allowed'||e==='service-not-allowed'?'Microphone access is blocked. Allow it in the browser address bar, or type instead.':e==='no-speech'?'Did not hear anything. Tap the mic and try again.':e==='network'?'The speech service could not be reached. Check your connection, or type instead.':e==='audio-capture'?'No microphone was found.':'Speech input stopped. You can type instead.');
  };
  r.onend=()=>{ if(REC===r) stopDict(); };
  try{ r.start(); REC=r; RECEL=el; btn.classList.add('on'); btn.setAttribute('aria-pressed','true'); st.textContent='Listening: speak now  (tap the mic to stop)'; }
  catch(e){ toast('Could not start the microphone. Try again.'); }
}
function addDictation(){
  document.querySelectorAll('#main textarea,#main input[type=text],#main input[type=number]').forEach(el=>{
    if(el.closest('.dict')||el.dataset.nomic) return;
    const w=document.createElement('div'); w.className='dict'+(el.tagName==='TEXTAREA'?'':' one'); w.style.flex=el.style.flex||''; if(el.style.flex) el.style.flex='';
    el.parentNode.insertBefore(w,el); w.appendChild(el);
    w.insertAdjacentHTML('beforeend',`<div class="dtools"><button type="button" class="mic lg" data-a="mic-lang" aria-label="Speech language" title="Speech language">${S.lang==='hi-IN'?'हि':'EN'}</button><button type="button" class="mic" data-a="mic" aria-label="Dictate this field" aria-pressed="false" title="Speak instead of typing">${ic('mic',16)}</button></div><div class="dstat" aria-live="polite"></div>`);
  });
}

function dealsCsv(){
  const head=['Brand','Deliverables','Status','First offer','Counter','Agreed fee','Signed','Invoiced','Received','Due date','Payment status'];
  const rows=S.deals.map(d=>{ const p=payOf(d); return [d.brand,d.deliverables,d.status,d.opening,d.counter,d.closed,(d.terms||{}).signedAt||'',p.invoiced,p.received,p.dueDate||'',p.status]; });
  return [head,...rows].map(r=>r.map(csvCell).join(',')).join('\n');
}
function chaseDraftFor(d){
  const p=payOf(d), inv=(d.terms||{}).invoice, n=dueIn(d), late=n!=null&&n<0?-n:null;
  return 'Hi, a quick note on '+(inv?'invoice '+inv.no+' ':'my invoice ')+'of '+INR(inv?inv.total:p.invoiced)+' for the '+d.brand+' campaign. '+(late!=null?'It was due on '+fmtD(p.dueDate)+', '+late+' day'+(late===1?'':'s')+' ago, and I have not yet received payment. ':'It falls due on '+fmtD(p.dueDate)+'. ')+'Could you confirm the payment date this week? Happy to resend the invoice if it helps.'+(S.profile.upi?'\n\nUPI: '+S.profile.upi:'');
}

/* reminders: shown to the creator in the app. CreVa never sends them anywhere. */
function remList(){
  if(S.profile&&S.profile.nPay===false) return [];
  const out=[];
  for(const d of S.deals){ const n=dueIn(d); if(n==null||d.status==='Paid') continue; if(n<0) out.push({d,kind:'late',days:-n}); else if(n<=7) out.push({d,kind:'soon',days:n}); }
  return out.sort((a,b)=>(a.kind==='late'?-1:1)-(b.kind==='late'?-1:1)||b.days-a.days);
}
function renderRem(){
  const el=document.getElementById('rempanel'); if(!el) return;
  if(!S.remOpen){ el.innerHTML=''; return; }
  const L=remList();
  el.innerHTML=`<div class="rempanel card" role="dialog" aria-label="Reminders"><div class="h3" style="margin-bottom:10px">Reminders <span class="sev ${L.length?'med':'ok'}">${L.length}</span></div>
    ${L.length?L.map(x=>`<div class="ins" style="margin-bottom:8px"><span class="ib sq">${ic(x.kind==='late'?'alert':'clock',18)}</span><div class="t"><b>${esc(x.d.brand)} · ${INR(payOf(x.d).invoiced-payOf(x.d).received)}</b><span>${x.kind==='late'?x.days+' day'+(x.days===1?'':'s')+' late':'Due in '+x.days+' day'+(x.days===1?'':'s')}</span></div>${x.kind==='late'?`<button class="btn sm p" data-a="rem-chase" data-id="${esc(x.d.id)}">Chase</button>`:`<button class="btn sm" data-a="rem-open" data-id="${esc(x.d.id)}">Open</button>`}</div>`).join(''):'<div class="muted">Nothing is due soon.</div>'}
    <p class="muted small" style="margin-top:8px">Reminders are shown to you only. CreVa never sends anything to a brand.</p></div>`;
}

/* consent-based sharing of a rate-checker result: anonymous, only when the visitor ticks the box */
function followersBand(n){ if(!n) return null; return n<10000?'under 10K':n<25000?'10K to 25K':n<50000?'25K to 50K':n<=100000?'50K to 100K':'over 100K'; }
async function shareCheck(){
  const o=S.chkOut, c=S.chk; if(!o) return;
  const box=document.getElementById('share_ok'); if(!box||!box.checked){ toast('Tick the consent box first.'); return; }
  if(!useApi()){ toast('Sharing needs the live site.'); return; }
  try{
    const res=await fetch('/api/data?kind=share',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({consent:true,platform:c.platform,followersBand:followersBand(+c.followers||0),deliverable:c.deliver,usage:c.usage,excl:c.excl,lastPaid:+c.last||null,low:o.low,high:o.high})});
    const d=await res.json().catch(()=>null);
    if(res.ok&&d&&d.ok){ S.shared=true; render(false); toast('Shared anonymously. Thank you.'); }
    else if(d&&d.code==='share_unavailable') toast('Sharing is not switched on in this database yet.');
    else toast('Could not share right now. Nothing was saved.');
  }catch(e){ toast('Could not share right now. Nothing was saved.'); }
}

/* profile photo: downscale to about 256px so it is small enough to keep with the profile */
function downscalePhoto(file,cb){
  const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{ const r=Math.min(1,256/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.max(1,Math.round(img.width*r)); c.height=Math.max(1,Math.round(img.height*r)); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); cb(c.toDataURL('image/jpeg',0.85)); };
  img.onerror=()=>{ URL.revokeObjectURL(url); cb(null); };
  img.src=url;
}
